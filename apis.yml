  name: FBI Crime Data Explorer
  description: >-
    The FBI Crime Data Explorer (CDE) provides public access to Uniform Crime Reporting (UCR) data through
    a JSON API. The API exposes summary statistics, agency-level participation, offense and arrest counts,
