        images:
          anyOf:
          - items:
              $ref: '#/components/schemas/ArtCrimeImage'
            type: array
          - type: 'null'
          title: Images
          default: []
        crimeCategory:
          anyOf:
          - type: string
          - type: 'null'
          title: Crimecategory
        maker:
          anyOf:
          - type: string
          - type: 'null'
          title: Maker
        materials:
          anyOf:
          - type: string
          - type: 'null'
          title: Materials
        measurements:
          anyOf:
          - type: string
          - type: 'null'
          title: Measurements
        period:
          anyOf:
          - type: string
          - type: 'null'
          title: Period
        additionalData:
          anyOf:
          - type: string
          - type: 'null'
          title: Additionaldata
        modified:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Modified
        publication:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Publication
        path:
          anyOf:
          - type: string
          - type: 'null'
          title: Path
        referenceNumber:
          anyOf:
          - type: string
          - type: 'null'
          title: Referencenumber
      type: object
      title: ArtCrime
